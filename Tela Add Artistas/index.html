<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Artistas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Global/global-style.css">
    <link rel="shortcut icon" href="../Imagens/logo_musichub.svg" type="image/x-icon">

</head>

<body>

    <!-- CABEÇALHO -->
   

    <!-- ESTRUTURA DA PÁGINA -->

    <main>

        <div class="titulo">

            <a href="#">

                <img src="../Imagens/Icone_seta_esquerda.svg" alt="">

            </a>
            <h1>Adicionar Artista(s)</h1>


        </div>

        <section>

            <article class="receber-imagem">
                
                <span>

                    <input class="selecionar-foto" type="file" id="foto">
                    <img src="../Imagens/Icone_foto.svg" alt="">
                    <label for="foto">Adicionar Imagem</label>
                    <p>Clique para selecionar a foto do(s) artista(s)</p>
                    
                </span>
                
            </article>
            
            <form>
                
                <div class="dados">
                    
                    <label for="nome">Nome do(s) Artista(s):</label>
                    <input type="text" id="nome" placeholder="Adicione o nome do(s) artista(s)">
                    
                </div>
                
                <div class="dados descricao">
                    
                    <label for="nome">Descrição:</label>
                    <input type="text" id="nome" placeholder="Adicione uma descrição sobre o(s) artista(s)">
                    
                </div>
                
                <div class="dados">
                    
                    <label for="nome">Genêro Musical:</label>
                    <input type="text" id="nome" placeholder="Ex: Rock, Jazz, Rap...">
                    
            </div>
            
            <button type="submit">Salvar</button>
            
        </form>
        
    </section>

    </main>
    
</body>

</html>
