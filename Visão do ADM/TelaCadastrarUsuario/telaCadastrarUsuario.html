<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário - MusicHub</title>
    <link rel="shortcut icon" href="../../Imagens/" type="image/x-icon">
    <link rel="stylesheet" href="../../Global/global-style.css">
    <link rel="stylesheet" href="telaCadastrarUsuario.css">
</head>

<body>
    <header class="cabecalho">
        <a class="cabecalho__inicio" href="#">
            <img src="../../Imagens/Icone_casa_inicio.svg" alt="Pagina inicial">
        </a>

        <a href="" class="Gerenciar-Usuarios">Gerenciar Usuários</a>

        <div class="logo-Musichub">
            <img src="../../Imagens/logoMusichub.svg" alt="">
        </div>


        <span class="cabecalho__perfil">Administrador</span>
    </header>
    <main class="conteudo-principal">

        <div class="titulo">
            <a href="#"><img src="../../Imagens/Icone_seta_esquerda.svg" alt=""></a>
            <h1>Cadastrar Usuário</h1>
        </div>

        <section>

            <article class="receber-imagem">

                <span class="add-imagem">

                    <input class="selecionar-foto" type="file" id="foto">
                    <img src="../../Imagens/icone_FotoPerfil.svg" alt="">
                    <label for="foto">Adicionar Foto</label>
                    <p>Selecione uma foto para seu perfil</p>

                </span>

            </article>

            <form class="form">

                <div class="dados">

                    <label for="nome">Nome de Usuário</label>
                    <input type="text" id="nome" placeholder="Ex: Márcio Oliveira">

                </div>

                <div class="dados descricao">

                    <label for="nome">E-mail</label>
                    <input type="text" id="nome" placeholder="Ex.: marcio.oliveira@email.com">
                    <p>*A senha do usuário será enviado ao e-mail preenchido acima</p>

                </div>

                <div class="dados">

                    <label for="nome">Celular</label>
                    <input type="text" id="nome" placeholder="Ex.: (11) 90000-0000">

                </div>

                <button class="botao" type="submit">Salvar</button>

            </form>

        </section>
        
    </main>

    <footer class="rodape">
        <nav class="rodape__navegacao" aria-label="Navegação principal">
            <ul class="rodape__lista">
                <li>
                    <a class="rodape__link" href="../Albuns/Albuns.html">Álbuns</a>
                </li>

                <li>
                    <a class="rodape__link" href="../Artistas/Artistas.html">Artistas</a>
                </li>

                <li>
                    <a class="rodape__link" href="../Podcasts/Podcasts.html">Podcasts</a>
                </li>


                <li>
                    <details class="rodape__cadastros">
                        <summary class="rodape__acionador" aria-label="Opções de cadastro">
                            <span aria-hidden="true">+</span>
                        </summary>

                        <div class="rodape__painel">
                            <ul class="rodape__opcoes">
                                <li>
                                    <a href="../../Tela Add Artistas/index.html">Adicionar Artista</a>
                                </li>

                                <li>
                                    <a href="../../Tela Add Música/adicionar-musica.html">Adicionar Música</a>
                                </li>

                                <li>
                                    <a href="../../Tela Adicionar Album/adicionar-album.html">Adicionar Álbum</a>
                                </li>

                                <li>
                                    <a href="../../Tela Adicionar Podcast/adicionar-podcast.html">Adicionar Podcast</a>
                                </li>
                            </ul>
                        </div>
                    </details>
                </li>

            </ul>

            <a class="rodape__perfil" href="#" aria-label="Meu perfil">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="4"
                        d="M24 20a7 7 0 1 0 0-14a7 7 0 0 0 0 14M6 40.8V42h36v-1.2c0-4.48 0-6.72-.872-8.432a8 8 0 0 0-3.496-3.496C35.92 28 33.68 28 29.2 28H18.8c-4.48 0-6.72 0-8.432.872a8 8 0 0 0-3.496 3.496C6 34.08 6 36.32 6 40.8" />

                </svg>
            </a>
        </nav>
    </footer>
</body>

</html>
