<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Artistas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../Global/global-style.css">
    <link rel="shortcut icon" href="../../Imagens/logo_musichub.svg" type="image/x-icon">

</head>

<body>

    <!-- CABEÇALHO -->
   
 <header class="cabecalho">

        <a class="cabecalho__inicio" href="#">

            <img src="../../Imagens/Icone_casa_inicio.svg" alt="Pagina inicial">

        </a>

        <form class="cabecalho__pesquisa" role="search">

            <label class="cabecalho__lupa" for="busca-site">

                <img src="../../Imagens/Icone_lupa_busca.svg" alt="Pesquisar no MusicHub">

            </label>

            <input id="busca-site" type="search" name="busca" placeholder="Algo em específico hoje?">
            <button class="cabecalho__buscar" type="submit">Buscar</button>

        </form>

        <button class="cabecalho__filtros" type="button">

            <img src="../../Imagens/Icone_filtro.svg" alt="Filtros">

        </button>

        <span class="cabecalho__perfil">Administrador</span>

    </header>

    <!-- ESTRUTURA DA PÁGINA -->

    <main>

        <div class="titulo">

            <a href="#">

               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m14 5-7 7 7 7" />
                </svg>

            </a>

            <h1>Adicionar Artista(s)</h1>


        </div>

        <section>

            <article class="receber-imagem">
                
                <span class="add-imagem">
                    <input class="selecionar-foto" type="file" id="foto">

                    <label  for="foto">
                        
                        <img class="icone-imagem" src="../../Imagens/Icone_foto.svg" alt="">
                        Adicionar Imagem
                        <p class="clique">Clique para selecionar a foto do(s) artista(s)</p>

                    </label>
                    
                </span>
                
            </article>
            
            <form class="form">
                
                <div class="dados">
                    
                    <label for="nome">Nome do(s) Artista(s):</label>
                    <input type="text" id="nome" placeholder="Adicione o nome do(s) artista(s)">
                    
                </div>
                
                <div class="dados descricao">
                    
                    <label for="nome">Descrição:</label>
                    <input type="text" id="nome" placeholder="Adicione uma descrição sobre o(s) artista(s)">
                    
                </div>
                
                <div class="dados">
                    
                    <label for="nome">Genêro Musical:</label>
                    <input type="text" id="nome" placeholder="Ex: Rock, Jazz, Rap...">
                    
            </div>
            
            <button class="botao" type="submit">Salvar</button>
            
        </form>
        
    </section>

    </main>

    <!-- RODAPÉ -->

        <footer class="rodape">
        <nav class="rodape__navegacao" aria-label="Navegação principal">
            <ul class="rodape__lista">
                <li>
                    <a class="rodape__link" href="../TelaInicialAdm/Albuns/Albuns.html">Álbuns</a>
                </li>

                <li>
                    <a class="rodape__link" href="../TelaInicialAdm/Artistas/Artistas.html">Artistas</a>
                </li>

                <li>
                    <a class="rodape__link" href="../TelaInicialAdm/Podcasts/Podcasts.html">Podcasts</a>
                </li>


                <li>
                    <details class="rodape__cadastros">
                        <summary class="rodape__acionador" aria-label="Opções de cadastro">
                            <span aria-hidden="true">+</span>
                        </summary>

                        <div class="rodape__painel">
                            <ul class="rodape__opcoes">
                                <li>
                                    <a href="../Tela Add Artistas/index.html">Adicionar Artista</a>
                                </li>

                                <li>
                                    <a href="../Tela Adicionar Musica/adicionar-musica.html">Adicionar Música</a>
                                </li>

                                <li>
                                    <a href="../Tela Adicionar Album/adicionar-album.html">Adicionar Álbum</a>
                                </li>

                                <li>
                                    <a href="../Tela Adicionar Podcast/adicionar-podcast.html">Adicionar Podcast</a>
                                </li>
                            </ul>
                        </div>
                    </details>
                </li>

            </ul>

            <a class="rodape__perfil" href="#" aria-label="Meu perfil">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="4"
                        d="M24 20a7 7 0 1 0 0-14a7 7 0 0 0 0 14M6 40.8V42h36v-1.2c0-4.48 0-6.72-.872-8.432a8 8 0 0 0-3.496-3.496C35.92 28 33.68 28 29.2 28H18.8c-4.48 0-6.72 0-8.432.872a8 8 0 0 0-3.496 3.496C6 34.08 6 36.32 6 40.8" />

                </svg>
            </a>
        </nav>
    </footer>
    
</body>

</html>
