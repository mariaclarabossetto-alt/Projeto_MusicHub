<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Artistas</title>
    <!-- Ligação ao ficheiro CSS externo -->
     <link rel="stylesheet" href="../../Global/global-style.css">
    <link rel="stylesheet" href="Artistas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

    <!-- Cabeçalho / Barra Superior -->
    <header class="cabecalho-superior">
        <button class="icone-btn casa-btn">
            <i class="fas fa-home"></i>
        </button>

        <div class="area-pesquisa">
            <i class="fas fa-search busca-icone"></i>
            <input type="text" placeholder="Algo em específico hoje?" class="busca-input">
        </div>

        <button class="icone-btn filtro-btn">
            <i class="fas fa-sliders-h"></i>
        </button>

        <div class="admin">
            Administrador
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="conteudo-principal">

        <!-- Secção 1: Recentes -->
        <section class="artista">
            <h2 class="titulo-secao">Artistas recentes</h2>
            
            <div class="artista-grid">
                <!-- Card 1 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_urias.svg" alt="Capa Urias" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Urias</h3>
                </article>

                <!-- Card 2 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_djavan.svg" alt="Capa DJavan" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">DJavan</h3>
                </article>

                <!-- Card 3 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_emicida.svg" alt="Capa Emicida" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Emicida</h3>
                </article>

                <!-- Card 4 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_lauryn.svg" alt="Capa Lauryn Hill" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Lauryn Hill</h3>
                </article>

                <!-- Card 5 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_kiss.svg" alt="Capa Kiss" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Kiss</h3>
                </article>

                <!-- Card 6 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_nanda.svg" alt="Capa Nanda Tsunami" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Nanda Tsunami</h3>
                </article>
            </div>
        </section>

        <!-- Secção 2: Últimas publicações -->
        <section class="artista">
            <h2 class="titulo-secao">Artistas Populares</h2>
            
            <div class="artista-grid">
                <!-- Card 1 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_urias.svg" alt="Capa Urias" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Urias</h3>
                </article>

                <!-- Card 2 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_djavan.svg" alt="Capa Djavan" class="capa-img">
                    </div>
                    <h3 class="artista-titulo">Djavan</h3>
                </article>

                <!-- Card 3 -->
                <article class="artista-card">
                    <div class="capa">

                    </div>
                    <h3 class="artista-titulo">Emicida</h3>
                </article>

                <!-- Card 4 -->
                <article class="artista-card">
                    <div class="capa">
                        <img src="../../Imagens/Artista_lauryn.svg" alt="Capa Lauryn Hill" class="capa-img">
                    </div>

                </article>
            </div>
        </section>

    </main>

    <!-- Rodapé / Barra de Navegação Inferior -->
    <footer class="rodape-inferior">
        <nav class="nav-links">
            <a href="../Albuns/Albuns.html" class="nav-item">Álbuns</a>
            <a href="../Artistas/Artistas.html" class="nav-item">Artistas</a>
            <a href="../Podcasts/Podcasts.html" class="nav-item">Podcasts</a>
            <button class="add-btn">
                <i class="fas fa-plus-circle"></i>
            </button>
        </nav>

        <div class="perfil-usuario">
            <button class="icon-btn perfil-btn">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </footer>
</body>
</html>
