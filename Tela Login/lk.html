<!DOCTYPE html>
<html lang="pt-br">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bibliotec-login</title>
        <link rel="stylesheet" href="login.css">
        <link rel="shortcut icon" href="../Projeto Bibliotec/imgs/Icone - Bibliotec.png" type="image/x-icon">
        <link rel="stylesheet" href="../styles/global.css">
        <!-- <script defer src="login.js"></script>  -->

</head>

<body>

    <!-------- HEADER -------->

    <header class="cabecalho">

        <a href="#">
            <img src="../Projeto Bibliotec/imgs/Logo Horizontal - branca.svg" alt="Logo horizontal branca">
        </a>

        <nav class="navegacao">
            <a href="../home/home.html">Home</a>

        </nav>

    </header>

    <!-------- CONTEUDO DE TODA A PAGINA -------->

    <main class="conteudo">


        <section class="login">


            <div class="login-cabecalho">

                <img src="../Projeto Bibliotec/imgs/Icone - Bibliotec.png" alt="Logo Bibliotec">

                <h1>Bem vindo(a) à Bibliotec</h1>
                <p>Acesse sua conta para continuar</p>

            </div>


            <form>

                <div class="campo">

                    <label for="email">E-mail</label>
                    <input required type="email" id="email" placeholder="email@alunosenai.com">

                </div>

                <div class="campo">

                    <label for="senha">Senha</label>

                    <div class="campo-senha">

                        <input required type="password" id="senha" placeholder="**********">

                        <button type="button" id="mostrar-senha" class="botao-olho">

                            <!-- Icone de olho -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />

                            </svg>

                        </button>

                    </div>

                </div>

                <button class="botao-entrar">Entrar</button>

                <button class="botao-google">

                    <img src="../Projeto Bibliotec/imgs/icone-google.svg" alt="Logo Google">
                    <span>Continuar com Google</span>

                </button>

            </form>

        </section>

    </main>
    
    <script src="login.js"></script>
</body>

</html>
