<!DCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login do MusicHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Global/global-style.css">
    <link rel="shortcut icon" href="../Imagens/Logo_musichub.svg" type="image/x-icon">

</head>

<body>


    <main class="conteudo">


        <img class="logo" src="../Imagens/Logo_musichub.svg"
            alt="O logótipo mostra um botão de play azul claro no centro, cercado por uma onda colorida em que passa de roxo para azul">

        <section>


            <form>


                <div class="campo">


                    <label for="email">E-mail</label>
                    <input required type="email" id="email">

                </div>

                <div class="campo">


                    <label for="senha">Senha</label>

                    <div class="barra-senha">


                        <input required type="password" id="senha">

                        <button type="button" id="mostrar-senha" class="olho">


                            <img src="../Imagens/Icone-olho.svg" alt="Icone de um olho aberto">

                        </button>

                    </div>

                    <button class="entrar">Entrar</button>

                </div>


                <a href="#" class="sem-conta">Não tem conta?</a>

                <div class="outras-formas">


                    <div class="forma">


                        <img src="../Imagens/Icone_google.svg" alt="">
                        <span>Continuar com Google</span>

                    </div>

                    <div class="forma">


                        <img src="../Imagens/Icone_facebook.svg" alt="">
                        <span>Continuar com Facebook</span>

                    </div>

                    <div class="forma">


                        <img src="../Imagens/Icone_telefone.svg" alt="">
                        <span>Continuar com Telefone</span>

                    </div>

                </div>

            </form>

            <a href="#" class="politica">Política de Privacidade</a>

        </section>

    </main>

</body>

</html>O
