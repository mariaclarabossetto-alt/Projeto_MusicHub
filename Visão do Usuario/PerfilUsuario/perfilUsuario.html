<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Perfil - MusicHub</title>
    <link rel="shortcut icon" href="../../Imagens/logo_musichub.svg" type="image/x-icon">
    <link rel="stylesheet" href="../../Global/global-style.css">
    <link rel="stylesheet" href="perfilUsuario.css">
    <link rel="shortcut icon" href="../../Imagens/Logo_musichub" type="image/x-icon">
</head>

<body class="corpo-pagina">
    <header class="cabecalho">
        <a class="cabecalho__inicio" href="../inicial-usuarios/index.html">
            <img src="../../Imagens/Icone_casa_inicio.svg" alt="Pagina inicial">
        </a>
        <div class="logo-container">
            <img src="../../Imagens/Logo_musichub" alt="Logo MusicHub">
        </div>
        <span class="cabecalho__perfil">Usuário</span>
    </header>

    <main class="conteudo-principal">

        <section class="profile-container">
            <div class="foto-perfil">
                <img id="visualizacao-foto" src="../../Imagens/icone-perfil-generico.png" alt="Foto de perfil"
                    class="foto-avatar">
                <label for="foto-input" class="botao-editar" title="Alterar foto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                    </svg>
                </label>
                <input type="file" id="foto-input" accept="image/*">
            </div>
            <form class="formulario-usuario">
                <div class="campo">
                    <label for="nome" class="dados-usuario">Nome de Usuário</label>
                    <input type="text" id="nome" placeholder="Insira seu nome">
                </div>
                <div class="campo">
                    <label for="email" class="dados-usuario">E-mail</label>
                    <input type="email" id="email" placeholder="seunome@email.com">
                </div>
                <div class="campo">
                    <label for="celular" class="dados-usuario">Celular</label>
                    <input type="tel" id="celular" placeholder="(11) 9 9999-9999">
                </div>
                <button class="btn-senha" id="alterar-senha">Alterar Senha</button>
                <div class="trocar-senha">
                    <h3>Insira sua senha</h3>
                    <div class="campo-senha">
                        <label for="senha-antiga">Senha antiga</label>
                        <input type="password" id="senha-antiga" placeholder="*****">
                    </div>
                    <div class="campo-senha">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="*****">
                    </div>
                    <div class="campo-senha">
                        <label for="senha-confirmar">Confirme sua senha</label>
                        <input type="password" id="senha-confirmar" placeholder="*****">
                    </div>
                    <div class="finalizar-Senha">
                        <button type="reset" class="btn-cancelar">CANCELAR</button>
                        <button type="submit" class="btn-salvar-senha">SALVAR</button>
                    </div>
                </div>
            </form>

          
            <button type="submit" class="btn-salvar">SALVAR E VOLTAR</button>
                <button type="submit" class="btn-sair">SAIR</button>

        </section>

    </main>

   <footer class="rodape">
        <nav class="rodape__navegacao" aria-label="Navegação principal">
            <ul class="rodape__lista">
                <li>
                    <a class="rodape__link" href="../plalists-uruarios/index.html">Playlists</a>
                </li>
                <li>
                    <a class="rodape__link" href="../albuns-usuarios/index.html">Álbuns</a>
                </li>

                <li>
                    <a class="rodape__link" href="../Tela Visão Artista Usuário/">Artistas</a>
                </li>

                <li>
                    <a class="rodape__link" href="../podcast-usuarios/index.html">Podcasts</a>
                </li>
                <li>
                    <a class="rodape__link" href="../baixados-usuarios/index.html">Baixados</a>
                </li>
                <li>
            </ul>

            <a class="rodape__perfil" href="../PerfilUsuario/perfilUsuario.html">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="4"
                        d="M24 20a7 7 0 1 0 0-14a7 7 0 0 0 0 14M6 40.8V42h36v-1.2c0-4.48 0-6.72-.872-8.432a8 8 0 0 0-3.496-3.496C35.92 28 33.68 28 29.2 28H18.8c-4.48 0-6.72 0-8.432.872a8 8 0 0 0-3.496 3.496C6 34.08 6 36.32 6 40.8" />

                </svg>

                </div></a>
        </nav>
    </footer>
</body>

</html>
